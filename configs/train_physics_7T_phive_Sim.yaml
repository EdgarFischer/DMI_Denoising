# PHIVE-style 7T control: reconstruct the unchanged noisy input with direct
# direct MSE in the configured ppm interval. No N2V/N2S corruption or
# blind-spot loss is used.
# MS_180 has global shape (X, Y, Z, F) = (64, 64, 33, 558).

run:
  name: Sim_AllReg_0001
  base_dir: trained_models
  gpu: "1"
  seed: 42

# Deliberately train a completely new network; no pretrained or resumed state.
resume_training: false
resume_ckpt: ""

# If true, the complete `masking` section is ignored. Input and target are
# identical and the data loss covers model.physics.denoising_ppm_range in
# valid brain voxels. Set false to restore the normal N2V behavior.
phive_mode: true

# PHIVE-compatible reconstruction scaling. For each voxel, sigma is estimated
# from the current complex residual magnitude inside 1.8-4.2 ppm without
# gradients. The existing masked mean data term is then divided by sigma^2.
physics_data_loss:
  residual_variance_scaling: true
  residual_std_epsilon: 1.0e-8
  residual_variance_warmup_epochs: 0

data:
  base_dir: /ceph/mri.meduniwien.ac.at/departments/radiology/mrsbrain/public/hfish/MRSISimulator/simulations
  data_filename: simulation_fid_noisy.npy
  spatial_mask_filename: brain_mask.npy

  # Full WALINET 7T training/validation split.
  train:
    - Simulation_SNR9/realization_000
    #- Vol4_Brisbane
    #- Vol5_Brisbane
    #- Vol6_Brisbane
    #- Vol2_London
    #- Vol3_London
    #- Vol4_London
    #- Vol5_London
    #- Vol6
    #- Vol7
    #- Vol8
    #- Vol9
  val:
    - Simulation_SNR9/realization_000
    #- Vol1_Brisbane
    #- Vol1_London

  # Global source axes: 0=X, 1=Y, 2=Z, 3=FID/frequency.
  # One Z slice is sampled per item; the network sees X, Y, and F.
  image_axes: [0, 1, 3]

  # Local position inside image_axes: [X, Y, F] -> F is local axis 2.
  spectral_axis: 2
  channel_axis: null

  # data_after_walinet.npy contains complex FIDs. Convert global axis 3
  # to the fftshifted spectrum expected by the physical decoder and loss.
  fourier_axes: [3]

  num_samples: 2000
  val_samples: 400

  # Existing Denoising behavior: normalize each subject in the FID domain
  # by its maximum absolute value before FFT. This is suitable for the first
  # training; quantitative amplitude rescaling will be handled later.
  normalization: false

  view_sampling:
    enabled: false
    views: []

augmentation:
  enabled: true

  # This augmentation is exactly representable by the free phase-0 map.
  global_phase:
    enabled: true
    p: 1.0

  permutation:
    enabled: false
    p: 0.0
    axes: []

  inversion:
    enabled: false
    p: 0.0
    axes: []

  global_scale:
    enabled: false
    p: 0.0
    min: 1.0
    max: 1.0

patching:
  enabled: true

  # Local order [X, Y, F]. Keep the complete spectrum and sample small
  # spatial patches to keep GPU memory usage controlled.
  patch_sizes: [16, 16, null]

masking:
  # Ignored while phive_mode is true; retained only so the same file can be
  # switched back to N2V by changing the single flag above.
  masked_axes: [2]
  mask_fraction: 0.1
  window_size: 3

model:
  architecture: physics_conv3d

  # The spatial size remains 16x16 throughout. Only F is downsampled.
  features: [8, 16, 24, 32, 48, 64]

  physics:
    # Source of LCModel basis, acquisition bandwidth, length, and dwell time.
    simulation_config: /ceph/mri.meduniwien.ac.at/departments/radiology/mrsbrain/public/hfish/walinet/configs/Simulation/7T_on_the_fly_558.yaml
    basis_dataset: clean_fid
    # Exact enabled basis-component set of Metabos_healthy_7T_2sigma.yaml.
    # Non-tumor/MS basis: TwoHG is deliberately excluded because physiological
    # 2HG is below in-vivo MRS detectability and strongly overlaps other bases.
    active_metabolites_only: false
    basis_components:
      [Asp, Cr, GABA, GPC, GSH, Gln, Ins, NAAG, NAA, PCh, PCr, Scyllo, Tau, Glu, Glc]
    # Hybrid scaling: reuse calibrated Z-score scales for amplitudes and the
    # retained global shift/phase parameters. New per-metabolite lineshape
    # parameters and the normalized kernel remain directly constrained.
    parameter_statistics_path: /ceph/mri.meduniwien.ac.at/departments/radiology/mrsbrain/public/hfish/Denoising/configs/physics_parameter_stats_7T_simulation_gt.json
    denoising_ppm_range: [1.8, 4.2]
    ppm_reference: 4.65
    hz_per_ppm: 297.222931

    # 558 -> 279 -> 140 -> 70 -> 35 -> 18 -> 9 frequency features.
    spectral_strides: [2, 2, 2, 2, 2, 2]
    spectral_kernel_size: 5
    spatial_kernel_size: 3
    parameter_head_hidden_channels: 128

    # Starting point only: basis amplitudes are inverse-RMS weighted and
    # jointly scaled to this reconstruction RMS. Shift and phases start at 0.
    # Start near the observed normalized in-vivo spectral scale instead of
    # close to the trivial zero reconstruction.
    initial_reconstruction_rms: 0.25
    initial_lorentzian_fwhm_hz: 5.0
    initial_gaussian_fwhm_hz: 3.0
    parameter_head_weight_std: 0.02

    # Simple Voigt model: one global frequency shift, Lorentz FWHM and
    # Gaussian FWHM per voxel. No flexible kernel and no metabolite-specific
    # frequency shifts or broadenings.
    lineshape_model: global_voigt

    # Exact forD baseline model used by MetabMapsAfterWalinet_2.1:
    # nine cubic B-splines with boundary knots, independently parameterized
    # for real and imaginary spectra (18 coefficients per voxel).
    baseline_n_splines: 9
    baseline_ppm_range: [1.8, 4.1]
    # The corresponding forD config fits conjugated subject FIDs. The model
    # maps that exact baseline back to the original Denoising orientation.
    baseline_conjugate_subject_signals: true
    # Exact conversion from forD's frequency-domain Z-score units to the
    # global max-abs-FID units used by this Denoising dataset.
    baseline_ford_to_model_scale: 0.34802767666497547
    baseline_coefficient_statistics_path: /ceph/mri.meduniwien.ac.at/departments/radiology/mrsbrain/public/hfish/Denoising/configs/ford_baseline_stats_7T_MS180.json

  # New parameterization inside the model:
  #   amplitudes                    -> softplus, positive
  #   metabolite Lorentz FWHM       -> softplus, positive and unbounded
  #   metabolite relative shifts    -> identity in Hz, no bound/saturation
  #   common 23-bin lineshape       -> softmax, positive and normalized
  #   global frequency/phase 0/1    -> identity
  # There is no learned residual branch. The only baseline is the fixed,
  # linear 9+9 coefficient forD cubic B-spline model above.

parameter_regularization:
  # One common alpha for the five global Voigt nuisance Z scores: frequency
  # shift, Lorentz FWHM, Gaussian FWHM, phase 0 and phase 1.
  enabled: true
  shift_weight: 0.0
  shift_mean_hz: 0.0
  shift_std_hz: 1.0
  fwhm_weight: 0.0
  fwhm_mean_hz: 0.0
  fwhm_std_hz: 1.0
  kernel_curvature_weight: 0.0
  voigt_nuisance_weight: 0.001
  # Calibrate once from the logged raw term: lambda = 0.05*data/raw_baseline.
  baseline_curvature_weight: 100000000

optim:
  lr: 0.0005
  factor: 0.5
  step_size: 100
  min_lr: 0.00002
  epochs: 1000

  # Conservative first-run settings. Increase after observing GPU memory.
  batch_size: 200
  num_workers: 0

inference:
  # Local order [X, Y, F]. These settings are included for completeness;
  # physics-model inference/parameter export will be connected separately.
  patch_strides: [8, 8, null]
  weight_mode: hann
